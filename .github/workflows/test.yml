name: Test

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  checks: write         # dorny/test-reporter posts check annotations
  pull-requests: write  # coverage comment on PRs

jobs:
  # ── Unit tests (matrix: multiple Go versions) ─────────────────────────────
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.23"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Test with race detector
        run: |
          gotestsum \
            --junitfile test-results.xml \
            --format pkgname \
            -- -race -coverprofile=coverage.out -covermode=atomic ./...

      # Publish failed/passed test details as PR check annotations.
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Test Results \U0001F9EA (Go ${{ matrix.go }})"
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

      # Upload coverage to Codecov (badge + PR diff overlay).
      # CODECOV_TOKEN secret is optional for public repos.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.go == '1.22'   # upload once, not per Go version
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Keep raw JUnit + coverage artefacts for 7 days.
      - name: Upload test artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-go${{ matrix.go }}
          path: |
            test-results.xml
            coverage.out
          retention-days: 7

  # ── PR coverage comment (runs once, after all matrix jobs) ───────────────
  coverage-comment:
    name: Coverage comment
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Generate coverage report
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Parse coverage
        id: cov
        run: |
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          {
            echo 'breakdown<<__EOF__'
            go tool cover -func=coverage.out
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const total   = '${{ steps.cov.outputs.total }}';
            const details = `${{ steps.cov.outputs.breakdown }}`;
            const pct     = parseFloat(total);
            const emoji   = pct >= 80 ? '🟢' : pct >= 60 ? '🟡' : '🔴';

            const body = [
              `## ${emoji} Coverage Report — ${total}`,
              '',
              '<details><summary>Per-package breakdown</summary>',
              '',
              '```',
              details,
              '```',
              '</details>',
              '',
              `_Updated for commit ${context.sha.slice(0, 7)}_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('## ') && c.body.includes('Coverage Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ── Build (binary + Docker) ───────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build binary
        run: go build -o /dev/null ./cmd/unifi-kuma

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          target: builder
